name: Code format

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install clang-format
        run: python -m pip install --disable-pip-version-check clang-format==23.1.3
      - name: Check code format
        run: bash scripts/format.sh --check
